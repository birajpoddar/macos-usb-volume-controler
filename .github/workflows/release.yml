name: Build & Release USBSoundControl

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build, Package & Release
    runs-on: macos-15 # GitHub-hosted Apple Silicon runner (macos-14 retired 2026-11-02)

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Application (Universal Binary)
        run: |
          xcodebuild clean build \
            -project USBSoundControl_Loopback.xcodeproj \
            -scheme USBSoundControl \
            -configuration Release \
            -derivedDataPath ./build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Application (.zip)
        run: |
          mkdir -p dist
          APP_PATH="./build/Build/Products/Release/USBSoundControl.app"
          chmod -R 755 "$APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/USBSoundControl-macOS.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/USBSoundControl-macOS.zip
          name: USBSoundControl ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### USBSoundControl (${{ github.ref_name }})

            Native macOS Menu Bar volume controller for external USB DACs (such as FiiO K7) using BlackHole 2ch audio loopback.

            #### Prerequisites
            Ensure BlackHole 2ch is installed before running:
            ```bash
            brew install blackhole-2ch
            ```

            #### Running on macOS
            1. Unzip `USBSoundControl-macOS.zip` and move `USBSoundControl.app` to `/Applications`.
            2. Remove the Gatekeeper quarantine attribute:
               ```bash
               xattr -cr /Applications/USBSoundControl.app
               ```
            3. Grant **Accessibility** permissions under **System Settings > Privacy & Security > Accessibility** when prompted to enable hardware volume keys (F11/F12).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
